{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Mi Proyecto Django{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/estilos.css' %}">
</head>
<body>
    <header class="header">
        <h1>Mi Proyecto Django</h1>
    </header>

    <nav class="navbar">
        <a href="{% url 'inicio' %}">Inicio</a>
        <a href="{% url 'acerca' %}">Acerca de</a>
        <a href="{% url 'contacto' %}">Contacto</a>
    </nav>

    <main class="contenido">
        {% if messages %}
            {% for m in messages %}
                <div class="alerta alerta-{{ m.tags }}">{{ m }}</div>
            {% endfor %}
        {% endif %}

        {% block contenido %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 Mi Proyecto Django</p>
    </footer>
</body>
</html>
